<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Global AI Mahlet</title>
  <meta
    name="description"
    content="Global AI Mahlet — Your AI Partner for a Smarter Future"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      color: #14234b;
      background:
        radial-gradient(circle at 10% 20%, rgba(93, 196, 255, 0.16), transparent 28%),
        radial-gradient(circle at 90% 25%, rgba(167, 112, 255, 0.17), transparent 30%),
        radial-gradient(circle at 50% 85%, rgba(255, 137, 204, 0.12), transparent 28%),
        #fbfcff;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /* =========================
       BACKGROUND WAVES
    ========================== */

    .page {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    .wave {
      position: absolute;
      left: -10%;
      width: 120%;
      height: 300px;
      pointer-events: none;
      z-index: 0;
      border-radius: 50%;
      filter: blur(1px);
    }

    .wave-one {
      top: 150px;
      background: linear-gradient(
        110deg,
        rgba(101, 206, 255, 0.20),
        rgba(255, 255, 255, 0),
        rgba(151, 112, 255, 0.18)
      );
      transform: rotate(-3deg);
    }

    .wave-two {
      top: 250px;
      background: linear-gradient(
        110deg,
        rgba(255, 255, 255, 0),
        rgba(178, 146, 255, 0.15),
        rgba(255, 169, 219, 0.15)
      );
      transform: rotate(4deg);
    }

    /* =========================
       HEADER
    ========================== */

    .header {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 20px 5%;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(100, 120, 200, 0.08);
    }

    .header-inner {
      max-width: 1180px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-logo {
      width: 62px;
      height: 62px;
      flex-shrink: 0;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 31px;
      color: white;
      background: linear-gradient(
        135deg,
        #00aaff,
        #5b63ff 48%,
        #9a3fff
      );
      box-shadow:
        0 12px 30px rgba(77, 94, 255, 0.25),
        inset 0 1px 1px rgba(255, 255, 255, 0.5);
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      font-size: clamp(22px, 4vw, 34px);
      font-weight: 800;
      line-height: 1.1;
      background: linear-gradient(
        90deg,
        #009ce8,
        #5865f2,
        #8d35e9
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .brand-subtitle {
      margin-top: 5px;
      color: #5c6c98;
      font-size: 15px;
      font-weight: 500;
    }

    .menu-button {
      width: 58px;
      height: 58px;
      flex-shrink: 0;
      border-radius: 50%;
      color: #172957;
      background: rgba(235, 241, 255, 0.9);
      border: 1px solid rgba(107, 130, 255, 0.16);
      box-shadow: 0 8px 25px rgba(78, 98, 180, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      transition: 0.25s ease;
    }

    .menu-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(78, 98, 180, 0.20);
    }

    /* =========================
       MAIN
    ========================== */

    .main {
      position: relative;
      z-index: 2;
      max-width: 1180px;
      margin: auto;
      padding: 75px 5% 35px;
    }

    .hero {
      text-align: center;
      max-width: 850px;
      margin: 0 auto 55px;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 72px);
      line-height: 1.05;
      font-weight: 850;
      letter-spacing: -2px;
      color: #132451;
    }

    .hero-name {
      background: linear-gradient(
        90deg,
        #2d77ff,
        #6657ef,
        #9d32ed
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .sparkle {
      display: inline-block;
      margin-left: 7px;
      animation: sparkle 2.2s ease-in-out infinite;
    }

    @keyframes sparkle {
      0%, 100% {
        transform: scale(1) rotate(0deg);
      }
      50% {
        transform: scale(1.18) rotate(8deg);
      }
    }

    .hero-text {
      margin: 25px auto 0;
      max-width: 720px;
      color: #617099;
      font-size: clamp(18px, 3vw, 25px);
      line-height: 1.55;
    }

    .hero-heart {
      color: #655bf3;
    }

    /* =========================
       FEATURE CARDS
    ========================== */

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      margin-bottom: 55px;
    }

    .feature-card {
      position: relative;
      min-height: 175px;
      padding: 25px;
      border-radius: 28px;
      border: 1px solid rgba(100, 130, 220, 0.12);
      overflow: hidden;
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .feature-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 45px rgba(74, 93, 180, 0.13);
    }

    .feature-card:nth-child(1) {
      background: linear-gradient(
        135deg,
        #e8f8ff,
        #f4fbff
      );
    }

    .feature-card:nth-child(2) {
      background: linear-gradient(
        135deg,
        #f1ebff,
        #faf7ff
      );
    }

    .feature-card:nth-child(3) {
      background: linear-gradient(
        135deg,
        #e9fff6,
        #f8fffc
      );
    }

    .feature-card:nth-child(4) {
      background: linear-gradient(
        135deg,
        #fff4e7,
        #fffaf5
      );
    }

    .feature-card:nth-child(5) {
      background: linear-gradient(
        135deg,
        #ffeef8,
        #fff7fc
      );
    }

    .feature-card:nth-child(6) {
      background: linear-gradient(
        135deg,
        #eaf1ff,
        #f7f9ff
      );
    }

    .feature-icon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      margin-bottom: 17px;
      background: rgba(255, 255, 255, 0.75);
      box-shadow: inset 0 0 0 1px rgba(100, 120, 200, 0.08);
    }

    .feature-card h3 {
      font-size: 21px;
      margin-bottom: 7px;
      color: #172b60;
    }

    .feature-card p {
      font-size: 15px;
      color: #596a9a;
      line-height: 1.4;
    }

    .arrow {
      position: absolute;
      right: 20px;
      bottom: 20px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.82);
      font-size: 21px;
      box-shadow: 0 7px 20px rgba(70, 90, 170, 0.10);
    }

    /* =========================
       CHAT BOX
    ========================== */

    .chat-section {
      margin-top: 10px;
    }

    .chat-box {
      position: relative;
      width: 100%;
      border-radius: 35px;
      padding: 22px;
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 2px solid rgba(112, 151, 255, 0.20);
      box-shadow:
        0 25px 70px rgba(66, 91, 180, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .message-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .message-icon {
      font-size: 27px;
      flex-shrink: 0;
    }

    #messageInput {
      width: 100%;
      min-height: 54px;
      max-height: 150px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: #182852;
      font-size: 18px;
      padding: 13px 0;
    }

    #messageInput::placeholder {
      color: #8995b5;
    }

    .send-button {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
      border-radius: 50%;
      color: white;
      font-size: 27px;
      background: linear-gradient(
        135deg,
        #5c83ff,
        #724cf0,
        #8738e9
      );
      box-shadow:
        0 10px 25px rgba(94, 83, 239, 0.28);
      transition: 0.2s ease;
    }

    .send-button:hover {
      transform: scale(1.05);
    }

    .chat-tools {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 15px;
    }

    .tool-button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #eef3ff;
      color: #24447f;
      font-size: 22px;
      transition: 0.2s ease;
    }

    .tool-button:hover {
      transform: translateY(-2px);
      background: #e4ebff;
    }

    .language {
      margin-left: auto;
      min-width: 110px;
      height: 48px;
      padding: 0 17px;
      border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #eef3ff;
      color: #263f77;
      font-weight: 700;
      cursor: pointer;
    }

    /* =========================
       AI RESPONSE AREA
    ========================== */

    .messages {
      display: none;
      margin-bottom: 25px;
      max-height: 430px;
      overflow-y: auto;
      padding: 5px;
    }

    .messages.visible {
      display: block;
    }

    .message {
      max-width: 85%;
      padding: 15px 18px;
      margin-bottom: 12px;
      border-radius: 20px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .message.user {
      margin-left: auto;
      color: white;
      background: linear-gradient(
        135deg,
        #6384ff,
        #754de8
      );
      border-bottom-right-radius: 5px;
    }

    .message.ai {
      margin-right: auto;
      color: #23345f;
      background: #f0f4ff;
      border-bottom-left-radius: 5px;
    }

    /* =========================
       FOOTER
    ========================== */

    .footer {
      text-align: center;
      padding: 35px 20px 45px;
      color: #6576aa;
      font-size: 16px;
    }

    .footer-heart {
      color: #635af1;
    }

    /* =========================
       LOADING
    ========================== */

    .typing {
      display: inline-flex;
      gap: 5px;
      align-items: center;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7183c4;
      animation: typing 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.45;
      }

      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    /* =========================
       TABLET
    ========================== */

    @media (max-width: 850px) {
      .features {
        grid-template-columns: repeat(2, 1fr);
      }

      .main {
        padding-top: 55px;
      }
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {
      .header {
        padding: 13px 16px;
      }

      .header-inner {
        gap: 10px;
      }

      .brand-logo {
        width: 48px;
        height: 48px;
        border-radius: 15px;
        font-size: 24px;
      }

      .brand-title {
        font-size: 20px;
      }

      .brand-subtitle {
        font-size: 11px;
      }

      .menu-button {
        width: 48px;
        height: 48px;
        font-size: 23px;
      }

      .main {
        width: 100%;
        padding: 48px 15px 25px;
      }

      .hero {
        margin-bottom: 38px;
      }

      .hero h1 {
        font-size: 41px;
        letter-spacing: -1.5px;
      }

      .hero-text {
        font-size: 17px;
        line-height: 1.55;
        padding: 0 5px;
      }

      .features {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .feature-card {
        min-height: 150px;
        padding: 21px;
        border-radius: 24px;
      }

      .feature-icon {
        width: 48px;
        height: 48px;
        font-size: 24px;
      }

      .feature-card h3 {
        font-size: 19px;
      }

      .feature-card p {
        font-size: 14px;
      }

      .chat-box {
        padding: 15px;
        border-radius: 27px;
      }

      .message-row {
        gap: 8px;
      }

      #messageInput {
        font-size: 16px;
        min-height: 50px;
      }

      .send-button {
        width: 52px;
        height: 52px;
        font-size: 23px;
      }

      .chat-tools {
        gap: 8px;
        flex-wrap: wrap;
      }

      .tool-button {
        width: 43px;
        height: 43px;
        font-size: 19px;
      }

      .language {
        margin-left: auto;
        height: 43px;
        min-width: 90px;
        padding: 0 12px;
        font-size: 14px;
      }

      .wave {
        height: 220px;
      }
    }

    /* =========================
       VERY SMALL PHONES
    ========================== */

    @media (max-width: 370px) {
      .brand-subtitle {
        display: none;
      }

      .hero h1 {
        font-size: 36px;
      }

      .chat-tools {
        gap: 6px;
      }

      .tool-button {
        width: 40px;
        height: 40px;
      }

      .language {
        min-width: 78px;
        padding: 0 8px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="wave wave-one"></div>
    <div class="wave wave-two"></div>

    <!-- ================= HEADER ================= -->

    <header class="header">
      <div class="header-inner">

        <div class="brand">

          <div class="brand-logo">
            ✦
          </div>

          <div class="brand-text">
            <div class="brand-title">
              Global AI Mahlet
            </div>

            <div class="brand-subtitle">
              Your AI Partner for a Smarter Future
            </div>
          </div>

        </div>

        <button
          class="menu-button"
          type="button"
          aria-label="Open menu"
          onclick="toggleMenu()"
        >
          ☰
        </button>

      </div>
    </header>

    <!-- ================= MAIN ================= -->

    <main class="main">

      <!-- HERO -->

      <section class="hero">

        <h1>
          Hello,
          <span class="hero-name">Mahlet</span>
          <span class="sparkle">✨</span>
        </h1>

        <p class="hero-text">
          I'm Global AI Mahlet — your smart assistant.
          <br />
          Ask me anything, anytime. I'm here to help you
          learn, create, solve, and grow!
          <span class="hero-heart">💙</span>
        </p>

      </section>

      <!-- ================= FEATURES ================= -->

      <section class="features">

        <button class="feature-card" onclick="useFeature('Study Help')">
          <div class="feature-icon">🎓</div>

          <h3>Study Help</h3>

          <p>
            Learn faster & better
          </p>

          <div class="arrow">→</div>
        </button>


        <button class="feature-card" onclick="useFeature('Coding & Tech')">
          <div class="feature-icon">💻</div>

          <h3>Coding & Tech</h3>

          <p>
            Build your skills
          </p>

          <div class="arrow">→</div>
        </button>


        <button class="feature-card" onclick="useFeature('Ideas & Creativity')">
          <div class="feature-icon">💡</div>

          <h3>Ideas & Creativity</h3>

          <p>
            Turn ideas into reality
          </p>

          <div class="arrow">→</div>
        </button>


        <button class="feature-card" onclick="useFeature('Write & Improve')">
          <div class="feature-icon">📄</div>

          <h3>Write & Improve</h3>

          <p>
            Better writing, clearer
          </p>

          <div class="arrow">→</div>
        </button>


        <button class="feature-card" onclick="useFeature('Global Information')">
          <div class="feature-icon">🌐</div>

          <h3>Global Information</h3>

          <p>
            Explore the world
          </p>

          <div class="arrow">→</div>
        </button>


        <button class="feature-card" onclick="useFeature('Your Goals')">
          <div class="feature-icon">🎯</div>

          <h3>Your Goals</h3>

          <p>
            Plan. Learn. Achieve.
          </p>

          <div class="arrow">→</div>
        </button>

      </section>


      <!-- ================= CHAT ================= -->

      <section class="chat-section">

        <div id="messages" class="messages"></div>

        <div class="chat-box">

          <div class="message-row">

            <div class="message-icon">
              ✨
            </div>

            <textarea
              id="messageInput"
              rows="1"
              placeholder="Message Global AI Mahlet..."
              aria-label="Message Global AI Mahlet"
              onkeydown="handleKey(event)"
            ></textarea>

            <button
              class="send-button"
              type="button"
              onclick="sendMessage()"
              aria-label="Send message"
            >
              ➤
            </button>

          </div>


          <div class="chat-tools">

            <button
              class="tool-button"
              type="button"
              onclick="openCamera()"
              aria-label="Camera"
            >
              📷
            </button>

            <button
              class="tool-button"
              type="button"
              onclick="openAttachment()"
              aria-label="Attachment"
            >
              📎
            </button>

            <button
              class="tool-button"
              type="button"
              onclick="openImage()"
              aria-label="Image"
            >
              🖼️
            </button>

            <button
              class="tool-button"
              type="button"
              onclick="startVoice()"
              aria-label="Voice"
            >
              🎙️
            </button>

            <button
              class="language"
              type="button"
              onclick="changeLanguage()"
            >
              🌐
              <span id="languageText">EN</span>
              <span>⌄</span>
            </button>

          </div>

        </div>

      </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">
      <span>—</span>
      <span class="footer-heart"> 💙 </span>
      Made for a better tomorrow
    </footer>

  </div>


  <!-- ================= JAVASCRIPT ================= -->

  <script>

    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");

    /* ---------------------------------
       ENTER KEY
    --------------------------------- */

    function handleKey(event) {

      if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();
      }
    }


    /* ---------------------------------
       ADD MESSAGE TO SCREEN
    -----------
