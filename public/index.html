<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050914"><title>Global AI Mahlet</title><link rel="stylesheet" href="/styles.css"></head>
<body><div class="app">
<header id="topbar"><button id="left" aria-label="Open left menu">☰</button><div class="brand"><span>✦</span> Global AI Mahlet</div><button id="right" aria-label="Open capabilities menu">⋮</button></header>
<main id="home"><div class="badge">● Intelligent workspace</div><h1>Your AI Partner<br>for a <i>Smarter Future.</i></h1>
<p>One intelligent workspace to think, create, research, code, and get things done.</p>
<section class="suggestions"><label>Start with an idea</label><div class="cards">
<button data-p="Research the latest information about "><span>⌕</span><b>Research</b><small>Find and understand</small></button>
<button data-p="Help me create "><span>✦</span><b>Create</b><small>Turn ideas into something</small></button>
<button data-p="Analyze the attached file and explain the key findings"><span>▤</span><b>Analyze</b><small>Understand your files</small></button>
<button data-p="Help me build "><span>&lt;/&gt;</span><b>Build</b><small>Code and solve</small></button></div></section>
<section id="chat" class="chat hidden"><div class="chat-head"><span id="title">New Chat</span><button id="clearView" aria-label="Start a new chat">＋ New</button></div><div id="messages" aria-live="polite"></div></section>
<div id="temp" class="temp hidden">◷ Temporary Chat is on <button id="off">Turn off</button></div>
<div class="composer-wrap"><div id="attachmentPreview" class="attachment-preview hidden"></div>
<div class="composer"><button id="plus" class="plus" aria-label="More options">＋</button><textarea id="prompt" placeholder="Ask anything..." rows="1" autocomplete="off"></textarea><button id="mic" class="mic" aria-label="Voice input">🎙</button><button id="send" aria-label="Send message">➤</button>
<div id="plusMenu" class="plus-menu hidden"><button data-action="photo">▧ Photo</button><button data-action="camera">📷 Camera</button><button data-action="file">▤ File</button><button data-action="think">✧ Think harder</button></div>
<nav><button id="attach" type="button">＋ Attach</button><button id="search" type="button">⌕ Search</button><button id="voice" type="button">◉ Voice</button><button id="create" type="button">✦ Create</button></nav>
<input id="fileInput" type="file" hidden multiple accept="image/*,.pdf,.txt,.md,.csv,.json,.doc,.docx,.xls,.xlsx">
<input id="photoInput" type="file" hidden accept="image/*"><input id="cameraInput" type="file" hidden accept="image/*" capture="environment"></div></div>
</main>
<div id="shade" class="shade hidden"></div>
<aside id="lp" aria-hidden="true"><div class="head"><b>✦ Global AI Mahlet</b><button id="lx" aria-label="Close left menu">✕</button></div><div class="body">
<button class="item primary" id="new">＋ New Chat</button><button class="item" id="temporary">◷ <span>Temporary Chat</span><em id="toggle"></em></button>
<button class="item" id="srch">⌕ Search Recent Chats</button><input id="recentSearch" class="searchbox hidden" placeholder="Search your chats...">
<h4>Recent Chats</h4><div id="recent" class="recent"></div><button class="item" id="rename">✎ Rename</button><button class="item" id="pin">⚑ Pin</button><button class="item danger" id="del">♲ Delete</button>
<hr><button class="item" id="settings">⚙ Settings</button><button class="profile" id="profile"><span>M</span><b>User Profile</b><small>Personal workspace</small>›</button></div></aside>
<aside id="rp" aria-hidden="true"><div class="head"><b>Workspace & Tools</b><button id="rx" aria-label="Close right menu">✕</button></div><div class="body"><input id="capSearch" class="searchbox" placeholder="Search tools..."><div id="capList"></div></div></aside>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card"><div class="modal-head"><b id="modalTitle">Settings</b><button id="modalClose" aria-label="Close">✕</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden" role="status"></div></div><script src="/app.js"></script></body></html>
