<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global AI Mahlet</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #202123;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      width: 280px;
      background: #f7f7f8;
      border-right: 1px solid #e5e5e5;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      padding: 8px 6px 12px;
    }

    .new-chat {
      width: 100%;
      border: 1px solid #d9d9d9;
      background: white;
      border-radius: 10px;
      padding: 11px;
      font-size: 15px;
      cursor: pointer;
      text-align: left;
    }

    .new-chat:hover {
      background: #eeeeee;
    }

    .search-box {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 9px;
      padding: 10px;
      outline: none;
      font-size: 14px;
    }

    .recent-title {
      font-size: 13px;
      color: #666;
      padding: 5px;
    }

    #recent-chats {
      overflow-y: auto;
      flex: 1;
    }

    .recent-chat {
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recent-chat:hover {
      background: #e9e9e9;
    }

    .sidebar-bottom {
      border-top: 1px solid #ddd;
      padding-top: 12px;
    }

    .sidebar-label {
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
    }

    #language-select {
      width: 100%;
      padding: 9px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
    }

    /* MAIN */
    .main {
      flex: 1;
      min-width: 0;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 58px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 12px;
    }

    #menu-button {
      display: none;
      border: 0;
      background: transparent;
      font-size: 25px;
      cursor: pointer;
    }

    .top-title {
      font-size: 17px;
      font-weight: 600;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 30px 20px 150px;
    }

    .welcome {
      max-width: 800px;
      margin: 80px auto 30px;
      text-align: center;
    }

    .welcome-avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      margin: 0 auto 15px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #666;
      line-height: 1.5;
    }

    .message {
      max-width: 850px;
      margin: 0 auto 24px;
      display: flex;
      gap: 12px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
    }

    .message-content {
      flex: 1;
      min-width: 0;
    }

    .message-name {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .message-text {
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user-message .avatar {
      background: #e5e7eb;
      color: #111827;
    }

    .typing {
      display: none;
      max-width: 850px;
      margin: 0 auto 20px;
      color: #666;
      font-size: 14px;
    }

    /* COMPOSER */
    .composer-area {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 20px 18px;
      background: linear-gradient(transparent, white 20%);
    }

    .composer {
      max-width: 850px;
      margin: 0 auto;
      border: 1px solid #d9d9d9;
      border-radius: 15px;
      background: white;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    #user-input {
      width: 100%;
      border: 0;
      outline: none;
      resize: none;
      padding: 14px 15px 8px;
      font-size: 15px;
      min-height: 50px;
      max-height: 150px;
      font-family: inherit;
    }

    .bottom-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 9px 9px;
    }

    .tool-group {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .tool-button {
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 19px;
      padding: 7px;
      border-radius: 8px;
    }

    .tool-button:hover {
      background: #f0f0f0;
    }

    #send-button {
      border: 0;
      background: #111827;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
    }

    #send-button:hover {
      background: #333;
    }

    #temporary-chat-button.active {
      background: #eeeeee;
    }

    .file-name {
      max-width: 200px;
      font-size: 12px;
      color: #666;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    input[type="file"] {
      display: none;
    }

    @media (max-width: 760px) {
      .sidebar {
        position: fixed;
        z-index: 20;
        top: 0;
        bottom: 0;
        left: -290px;
        transition: left 0.2s ease;
        box-shadow: 3px 0 15px rgba(0,0,0,0.12);
      }

      .sidebar.open {
        left: 0;
      }

      #menu-button {
        display: block;
      }

      .chat-messages {
        padding-left: 14px;
        padding-right: 14px;
      }

      .composer-area {
        padding-left: 10px;
        padding-right: 10px;
      }

      .welcome {
        margin-top: 45px;
      }

      .welcome h1 {
        font-size: 25px;
      }
    }
  </style></head><body>
  <div class="app"><aside class="sidebar" id="sidebar">
  <div class="brand">Global AI Mahlet</div>

  <button class="new-chat" id="new-chat-button">
    ＋ New Chat
  </button>

  <input
    type="text"
    id="recent-search"
    class="search-box"
    placeholder="Search recent chats..."
  >

  <div class="recent-title">Recent chats</div>
  <div id="recent-chats"></div>

  <div class="sidebar-bottom">
    <div class="sidebar-label">Language</div>

    <select id="language-select">
      <option value="English">English</option>
      <option value="Amharic">Amharic</option>
      <option value="Arabic">Arabic</option>
      <option value="Chinese">Chinese</option>
      <option value="Spanish">Spanish</option>
      <option value="French">French</option>
      <option value="Portuguese">Portuguese</option>
      <option value="Russian">Russian</option>
      <option value="German">German</option>
      <option value="Italian">Italian</option>
      <option value="Japanese">Japanese</option>
      <option value="Korean">Korean</option>
      <option value="Hindi">Hindi</option>
      <option value="Urdu">Urdu</option>
      <option value="Bengali">Bengali</option>
      <option value="Turkish">Turkish</option>
      <option value="Dutch">Dutch</option>
      <option value="Swedish">Swedish</option>
      <option value="Norwegian">Norwegian</option>
      <option value="Danish">Danish</option>
      <option value="Finnish">Finnish</option>
      <option value="Polish">Polish</option>
      <option value="Ukrainian">Ukrainian</option>
      <option value="Greek">Greek</option>
      <option value="Hebrew">Hebrew</option>
      <option value="Persian">Persian</option>
      <option value="Swahili">Swahili</option>
      <option value="Hausa">Hausa</option>
      <option value="Yoruba">Yoruba</option>
      <option value="Igbo">Igbo</option>
      <option value="Somali">Somali</option>
      <option value="Oromo">Oromo</option>
      <option value="Tigrinya">Tigrinya</option>
      <option value="Vietnamese">Vietnamese</option>
      <option value="Thai">Thai</option>
      <option value="Indonesian">Indonesian</option>
      <option value="Malay">Malay</option>
      <option value="Filipino">Filipino</option>
      <option value="Romanian">Romanian</option>
      <option value="Czech">Czech</option>
      <option value="Slovak">Slovak</option>
      <option value="Hungarian">Hungarian</option>
      <option value="Bulgarian">Bulgarian</option>
      <option value="Serbian">Serbian</option>
      <option value="Croatian">Croatian</option>
      <option value="Slovenian">Slovenian</option>
      <option value="Lithuanian">Lithuanian</option>
      <option value="Latvian">Latvian</option>
      <option value="Estonian">Estonian</option>
      <option value="Icelandic">Icelandic</option>
    </select>
  </div>
</aside>

<main class="main">

  <header class="topbar">
    <button id="menu-button">☰</button>
    <div class="top-title">Global AI Mahlet</div>
  </header>

  <section id="chat-messages" class="chat-messages">

    <div id="welcome" class="welcome">
      <div class="welcome-avatar">🤖</div>
      <h1>Welcome to Global AI Mahlet</h1>
      <p>
        Your multilingual AI assistant and study tutor.
        Ask questions, learn concepts, solve problems, understand images,
        and explore ideas.
      </p>
    </div>

    <div id="typing-indicator" class="typing">
      Global AI Mahlet is thinking...
    </div>

  </section>

  <div class="composer-area">
    <div class="composer">

      <textarea
        id="user-input"
        rows="1"
        placeholder="Message Global AI Mahlet..."
      ></textarea>

      <div class="bottom-tools">

        <div class="tool-group">

          <button
            class="tool-button"
            id="photo-button"
            title="Understand a photo"
            type="button"
          >📷</button>

          <input
            id="photo-input"
            type="file"
            accept="image/*"
          >

          <button
            class="tool-button"
            id="file-button"
            title="Upload a file"
            type="button"
          >📎</button>

          <input
            id="file-input"
            type="file"
            accept=".txt,.pdf,.doc,.docx,.csv"
          >

          <button
            class="tool-button"
            id="camera-button"
            title="Take a photo"
            type="button"
          >🖼️</button>

          <input
            id="camera-input"
            type="file"
            accept="image/*"
            capture="environment"
          >

          <button
            class="tool-button"
            id="voice-button"
            title="Voice mode"
            type="button"
          >🎤</button>

          <button
            class="tool-button"
            id="temporary-chat-button"
            title="Temporary chat"
            type="button"
          >🕐</button>

          <span id="file-name" class="file-name"></span>

        </div>

        <button id="send-button" type="button">➤</button>

      </div>
    </div>
  </div>

</main>

  </div>  <script src="chat.js"></script></body>
  </html>
